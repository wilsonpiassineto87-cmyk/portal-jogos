<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireframe</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}#hint{position:fixed;bottom:10px;width:100%;text-align:center;color:#0f0;font:14px monospace;opacity:.6}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">move the mouse / drag to spin</div>
<script>
// Toro em wireframe girando em 3D, com projeção em perspectiva.
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, ax = 0.6, ay = 0, mx = 0, my = 0;
function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
addEventListener('resize', size); size();
addEventListener('pointermove', e => { mx = (e.clientX / W - 0.5) * 2; my = (e.clientY / H - 0.5) * 2; });
const R = 1.6, r = 0.7, U = 36, V = 18, pts = [];
for (let i = 0; i < U; i++) for (let j = 0; j < V; j++) {
  const u = i / U * Math.PI * 2, v = j / V * Math.PI * 2;
  pts.push([(R + r * Math.cos(v)) * Math.cos(u), (R + r * Math.cos(v)) * Math.sin(u), r * Math.sin(v)]);
}
function proj([px, py, pz]) {
  let y1 = py * Math.cos(ax) - pz * Math.sin(ax), z1 = py * Math.sin(ax) + pz * Math.cos(ax);
  let x2 = px * Math.cos(ay) + z1 * Math.sin(ay), z2 = -px * Math.sin(ay) + z1 * Math.cos(ay);
  const s = Math.min(W, H) / 2.2 / (z2 + 5) * 4;
  return [W / 2 + x2 * s, H / 2 + y1 * s, z2];
}
(function frame(t) {
  ay += 0.01 + mx * 0.03; ax += 0.004 + my * 0.02;
  x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, 0, W, H);
  const P = pts.map(proj);
  x.lineWidth = 1.2;
  for (let i = 0; i < U; i++) for (let j = 0; j < V; j++) {
    const a = P[i * V + j], b = P[((i + 1) % U) * V + j], d = P[i * V + (j + 1) % V];
    const hue = (i * 10 + t / 20) % 360;
    x.strokeStyle = `hsla(${hue},100%,60%,${0.35 + (a[2] + 3) / 8})`;
    x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.moveTo(a[0], a[1]); x.lineTo(d[0], d[1]); x.stroke();
  }
  requestAnimationFrame(frame);
})(0);
</script>
</body>
</html>
